apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-sentinel
  namespace: api-sentinel
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: apisentinel.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80