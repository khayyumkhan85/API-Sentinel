apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-service
  namespace: api-sentinel
spec:
  replicas: 2
  selector: { matchLabels: { app: contract-service } }
  template:
    metadata:
      labels: { app: contract-service }
    spec:
      containers:
        - name: contract-service
          image: apisentinel/contract-service:1.0.0
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: apisentinel-config }
            - secretRef: { name: apisentinel-secret }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
---
apiVersion: v1
kind: Service
metadata:
  name: contract-service
  namespace: api-sentinel
spec:
  ports: [{ port: 8081 }]
  selector: { app: contract-service }
---
