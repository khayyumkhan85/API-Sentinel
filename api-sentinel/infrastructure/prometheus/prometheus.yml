global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: contract-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['contract-service:8081']

  - job_name: dependency-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['dependency-service:8082']

  - job_name: analysis-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['analysis-service:8083']

  - job_name: mcp-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['mcp-server:8084']

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']