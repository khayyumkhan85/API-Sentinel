openapi: 3.0.0
info:
  title: Payment API
  version: 1.0.0
paths:
  /payments:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
components:
  schemas:
    PaymentRequest:
      type: object
      required: [orderId, amount, method]
      properties:
        orderId: { type: string }
        amount: { type: number }
        method:
          type: string
          enum: [CARD, PAYPAL, APPLE_PAY, GOOGLE_PAY]
    Payment:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, AUTHORIZED, CAPTURED, FAILED] }