openapi: 3.0.0
info:
  title: Customer API
  version: 1.0.0
  description: Customer profile service
paths:
  /customers/{id}:
    get:
      summary: Get customer by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
components:
  schemas:
    Customer:
      type: object
      required:
        - id
        - customerName
      properties:
        id:
          type: string
        customerName:
          type: string
        email:
          type: string