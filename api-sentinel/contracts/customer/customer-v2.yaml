openapi: 3.0.0
info:
  title: Customer API
  version: 2.0.0
  description: Customer profile service - restructured response
paths:
  /customers/{id}:
    get:
      summary: Get customer by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
components:
  schemas:
    Customer:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        customer:
          type: object
          properties:
            name:
              type: string
            email:
              type: string