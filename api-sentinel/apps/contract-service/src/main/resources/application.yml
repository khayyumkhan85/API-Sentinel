server:
  port: 8081

spring:
  application:
    name: contract-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apisentinel}
    username: ${DB_USER:apisentinel}
    password: ${DB_PASS:apisentinel}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

apisentinel:
  topics:
    registered: contract.registered
    changed: contract.changed
    breaking: contract.breaking-change.detected