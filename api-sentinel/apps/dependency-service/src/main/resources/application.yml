server:
  port: 8082

spring:
  application:
    name: dependency-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apisentinel}
    username: ${DB_USER:apisentinel}
    password: ${DB_PASS:apisentinel}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics