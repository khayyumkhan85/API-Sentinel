version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: apisentinel
      POSTGRES_USER: apisentinel
      POSTGRES_PASSWORD: apisentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  contract-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: contract-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/apisentinel
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on: [postgres, redis, kafka]
    ports:
      - "8081:8081"

  dependency-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: dependency-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/apisentinel
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on: [postgres, redis, kafka]
    ports:
      - "8082:8082"

  analysis-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: analysis-service
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on: [kafka]
    ports:
      - "8083:8083"

  mcp-server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: mcp-server
    ports:
      - "8084:8084"

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: api-gateway
    depends_on: [contract-service, dependency-service, analysis-service, mcp-server]
    ports:
      - "8080:8080"

volumes:
  pgdata: