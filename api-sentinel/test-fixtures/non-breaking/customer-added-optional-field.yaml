# Non-breaking change example - optional PROPERTY_ADDED
openapi: 3.0.0
info:
  title: Customer API
  version: 1.1.0
paths:
  /customers/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
components:
  schemas:
    Customer:
      type: object
      required: [id, customerName]
      properties:
        id: { type: string }
        customerName: { type: string }
        email: { type: string }   # optional new field