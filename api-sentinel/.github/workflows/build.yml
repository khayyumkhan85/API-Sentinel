name: build-and-test
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/libs.versions.toml') }}
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  contract-governance:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed OpenAPI specs
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'contracts/**/*.yaml' 'contracts/**/*.yml' || true)
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
      - name: Run API Sentinel governance check
        if: steps.changed.outputs.files != ''
        run: |
          echo "Changed specs:"
          echo "${{ steps.changed.outputs.files }}"
          echo "A deployed API Sentinel would be called here:"
          echo "  POST /api/v1/contracts/{old}/compare/{new}"
          echo "and this job would fail when recommendation == BLOCK."